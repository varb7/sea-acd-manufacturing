data:
  data_file: data/real_datasets/index.csv
  debug: false
  batch_size: 1
  fci_vars: 5
  fci_batches: 10
  fci_batches_inference: 500
  fci_batch_size: 500
  num_workers: 1
  accumulate_batches: 1
  log_frequency: 10
  results_file: data/real_datasets_results/results_ges_finetuned.pkl
  use_learned_sampler: false
model:
  algorithm: ges
  model: aggregator
  num_vars: 1000
  num_edge_types: 5
  embed_dim: 64
  transformer_num_layers: 4
  n_heads: 8
  ffn_embed_dim: 8
train:
  run_name: fges_finetune
  patience: 30
  epochs: 1000
  min_epochs: 50
  lr: 5.0e-05
  weight_decay: 5.0e-05
  metric: Val/auprc
